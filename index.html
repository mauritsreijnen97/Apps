<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Apps</title>
<meta name="theme-color" content="#060a22">
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px 16px;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:#f5f5f7;
    background:radial-gradient(900px 500px at 50% -10%,#1b2a7a,transparent 60%),#060a22}
  main{width:min(560px,100%);display:grid;gap:16px}
  h1{margin:0 0 6px;font-size:clamp(34px,8vw,48px);letter-spacing:-.04em;line-height:1.05}
  p{margin:0;color:#a1a1a6}
  a{display:grid;gap:4px;padding:20px 22px;border-radius:22px;background:rgba(255,255,255,.07);color:inherit;text-decoration:none;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .3s,background .3s}
  a:hover{background:rgba(255,255,255,.11);transform:translateY(-2px)}
  a b{font-size:20px;letter-spacing:-.02em}
  a span{color:#a1a1a6;font-size:14px}
</style>
</head>
<body>
<main>
  <div><h1>Apps</h1><p>Two little websites.</p></div>
  <a href="disneyland-paris/"><b>Our Magic Weekend ✨</b><span>Disneyland Paris guide · 29–30 November 2026</span></a>
  <a href="french-home/"><b>The French Country Club</b><span>French country living magazine</span></a>
</main>
</body>
</html>
